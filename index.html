<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Family Photos</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Hind:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --peacock:#0d3a40;      /* page */
  --peacock-deep:#082a2f; /* panels */
  --peacock-line:#1d5a61;
  --marigold:#f2a51a;     /* the one accent */
  --silk:#f4ece0;         /* text */
  --mist:#a9c3c2;         /* secondary text */
  --ring:rgba(242,165,26,.0);
  --r-face:50%;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--peacock);color:var(--silk);font:400 17px/1.55 Hind,system-ui,sans-serif}
body{min-height:100vh;background:
  radial-gradient(1200px 600px at 85% -10%, #155159 0%, transparent 60%),
  radial-gradient(900px 500px at -10% 110%, #0a3237 0%, transparent 60%), var(--peacock)}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--marigold);outline-offset:3px}
.wrap{max-width:1240px;margin:0 auto;padding-block:0;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}

/* header */
header.top{padding:56px 0 28px}
h1{font:400 clamp(46px,8vw,104px)/.95 "Rozha One",serif;margin:0;letter-spacing:-.01em}
h1 .mark{display:inline-block;width:.42em;height:.42em;border-radius:50%;background:var(--marigold);margin-left:.16em;vertical-align:.12em;box-shadow:0 0 0 .1em rgba(242,165,26,.25)}
.lede{max-width:56ch;color:var(--mist);margin:14px 0 0;font-size:19px}
nav.tabs{display:flex;gap:6px;margin-top:30px;flex-wrap:wrap}
nav.tabs button{background:none;border:1px solid var(--peacock-line);border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--mist);transition:background .2s,color .2s,border-color .2s}
nav.tabs button[aria-selected=true]{background:var(--marigold);border-color:var(--marigold);color:#2a1a00;font-weight:600}
.tools{display:flex;gap:14px;align-items:center;margin:26px 0 8px;flex-wrap:wrap}
.search{flex:1 1 240px;max-width:360px;background:var(--peacock-deep);border:1px solid var(--peacock-line);border-radius:999px;padding:10px 18px;color:var(--silk);font:inherit}
.search::placeholder{color:#6f9a9a}
label.toggle{color:var(--mist);font-size:15px;display:flex;gap:8px;align-items:center;cursor:pointer}
label.toggle input{accent-color:var(--marigold);width:18px;height:18px}

/* people grid: the signature */
.people{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:34px 22px;padding:26px 0 80px}
.person{background:none;border:0;padding:0;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:scale(.6) rotate(-8deg);animation:bloom .7s cubic-bezier(.2,.9,.25,1.25) forwards;animation-delay:calc(var(--i)*22ms)}
.person .ph{position:relative;width:118px;height:118px;border-radius:var(--r-face)}
.person .ph::before{content:"";position:absolute;inset:-7px;border-radius:50%;
  background:conic-gradient(from var(--a,0deg),var(--marigold),transparent 30%,transparent 70%,var(--marigold));
  opacity:0;transition:opacity .35s}
.person img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid var(--peacock-deep);transition:transform .35s cubic-bezier(.2,.9,.25,1.2)}
.person:hover .ph::before,.person:focus-visible .ph::before{opacity:1;animation:spin 2.4s linear infinite}
.person:hover img{transform:scale(1.06)}
.person:focus-visible{outline:none}
.person .nm{font-weight:600;font-size:15px;line-height:1.2}
.person .ct{font-size:13px;color:var(--mist);margin-top:-8px}
.person.big .ph{width:148px;height:148px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.ren{background:none;border:0;color:var(--mist);font-size:13px;cursor:pointer;padding:2px 8px;border-radius:999px;text-decoration:underline;text-decoration-color:var(--peacock-line);text-underline-offset:3px}
.ren:hover{color:var(--marigold)}
.ren-in{width:100%;max-width:150px;background:var(--peacock-deep);border:1px solid var(--marigold);border-radius:8px;color:var(--silk);font:inherit;font-size:14px;padding:4px 8px;text-align:center}
.person.off img{filter:grayscale(1);opacity:.35}
.person.off .ct{color:var(--marigold)}
.vt{overflow-x:auto;margin-bottom:60px}
.vt table{border-collapse:collapse;min-width:520px;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
.vt th{text-align:left;color:var(--mist);font-weight:500;padding:8px 12px;border-bottom:1px solid var(--peacock-line)}
.vt td{padding:10px 12px;border-bottom:1px solid var(--peacock-line)}
.nmi{width:100%;max-width:150px;background:transparent;border:1px solid transparent;border-radius:8px;color:var(--silk);font:600 15px/1.2 Hind,system-ui,sans-serif;padding:4px 6px;text-align:center;transition:border-color .2s,background .2s}
.nmi::placeholder{color:var(--silk);opacity:1}
.nmi:hover{border-color:var(--peacock-line)}
.nmi:focus{outline:none;border-color:var(--marigold);background:var(--peacock-deep)}
.nmi:focus::placeholder{color:#6f9a9a}
.pcard .ct{margin-top:-6px;font-size:13px;color:var(--mist)}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;margin-bottom:10px}
.vcard{position:relative;border:0;padding:0;background:var(--peacock-deep);border-radius:10px;overflow:hidden;cursor:pointer;aspect-ratio:16/10;color:var(--silk)}
.vcard img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s ease}
.vcard:hover img{transform:scale(1.05)}
.vcard .play{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:rgba(8,42,47,.72);border:2px solid var(--marigold);display:grid;place-items:center;transition:transform .25s}
.vcard .play::after{content:"";border-left:16px solid var(--marigold);border-top:10px solid transparent;border-bottom:10px solid transparent;margin-left:4px}
.vcard:hover .play{transform:scale(1.1)}
.vcard .dur{position:absolute;right:8px;bottom:8px;background:rgba(8,42,47,.8);border-radius:6px;padding:1px 7px;font-size:13px;font-variant-numeric:tabular-nums}
.vb{position:fixed;inset:0;background:rgba(4,22,25,.95);display:none;z-index:60;align-items:center;justify-content:center;flex-direction:column;gap:12px}
.vb.on{display:flex;animation:fade .25s ease}
.vb video{max-width:92vw;max-height:78vh;border-radius:8px;background:#000}
.vb .cap{color:var(--mist);font-size:15px;text-align:center;padding:0 16px}
.vb .cap b{color:var(--silk);font-weight:600}
.vb .x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));background:none;border:1px solid var(--peacock-line);border-radius:999px;padding:6px 16px;cursor:pointer;color:var(--silk)}
@property --a{syntax:"<angle>";inherits:false;initial-value:0deg}
@keyframes spin{to{--a:360deg}}
@keyframes bloom{to{opacity:1;transform:none}}

/* gallery view */
.gallery-head{display:flex;gap:28px;align-items:center;padding:40px 0 10px;flex-wrap:wrap}
.gallery-head .hero{width:168px;height:168px;border-radius:50%;object-fit:cover;border:5px solid var(--marigold);box-shadow:0 18px 50px rgba(0,0,0,.35)}
.gallery-head h2{font:400 clamp(38px,5vw,64px)/1 "Rozha One",serif;margin:0}
.gallery-head .sub{color:var(--mist);margin-top:8px}
.namebox{background:transparent;border:0;border-bottom:2px dashed var(--peacock-line);color:var(--silk);font:400 clamp(38px,5vw,64px)/1.05 "Rozha One",serif;width:min(100%,14ch);padding:0}
.namebox:focus{outline:none;border-bottom-color:var(--marigold)}
.back{background:none;border:1px solid var(--peacock-line);border-radius:999px;padding:8px 18px;cursor:pointer;color:var(--mist);margin-top:30px}
.back:hover{color:var(--silk);border-color:var(--mist)}
.hint{font-size:14px;color:#7fa4a3;margin-top:6px}
section.ev{margin:34px 0 10px}
section.ev h3{font:400 28px/1.15 "Rozha One",serif;margin:0 0 4px;overflow-wrap:anywhere}
section.ev .evmeta{color:var(--mist);font-size:15px;margin-bottom:14px}
.grid{columns:4 230px;column-gap:12px}
.tile{break-inside:avoid;margin:0 0 12px;position:relative;display:block;width:100%;border:0;padding:0;background:var(--peacock-deep);border-radius:10px;overflow:hidden;cursor:zoom-in}
.tile img{display:block;width:100%;height:auto;transition:transform .5s ease,filter .3s}
.tile:hover img{transform:scale(1.04)}
.tile{background:linear-gradient(100deg,var(--peacock-deep) 30%,#123f45 50%,var(--peacock-deep) 70%);background-size:300% 100%;animation:shimmer 1.6s linear infinite}
.tile img{opacity:1;transition:opacity .35s ease,transform .5s ease}
.tile img[src^="data:"]{opacity:0}
@keyframes shimmer{from{background-position:100% 0}to{background-position:-200% 0}}
.zbar .sep{width:1px;background:var(--peacock-line);margin:4px 2px}
.zbar button.on{background:var(--marigold);color:#2a1a00;border-color:var(--marigold)}
.zbar svg{width:16px;height:16px;vertical-align:-3px;margin-right:6px;fill:none;stroke:currentColor;stroke-width:2}
.zbar a.zbtn{background:rgba(13,58,64,.85);border:1px solid var(--peacock-line);color:var(--silk);border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;text-decoration:none;font-size:15px}
.zbar a.zbtn:hover{border-color:var(--marigold)}
.zbar button.zt{font-size:15px}
.lb .rtag{position:absolute;transform:translate(-50%,6px);background:var(--marigold);color:#2a1a00;font-size:13px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap;pointer-events:none;animation:ringin .5s .2s both}
.lb .ring.other{border-color:var(--silk);border-width:2px}
.lb .rtag.other{background:var(--silk)}
#totop{position:fixed;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:46px;height:46px;border-radius:50%;background:var(--marigold);color:#2a1a00;border:0;font-size:20px;cursor:pointer;box-shadow:0 8px 24px rgba(0,0,0,.35);opacity:0;transform:translateY(20px);pointer-events:none;transition:opacity .25s,transform .25s;z-index:20}
#totop.show{opacity:1;transform:none;pointer-events:auto}
@media (max-width:600px){.zbar .lbl{display:none}.zbar svg{margin-right:0}.zbar{gap:5px}.zbar button,.zbar a.zbtn{padding:0 10px;min-width:36px}}
.tile.miss{aspect-ratio:4/3;display:grid;place-items:center;color:var(--mist);font-size:14px}
.more{display:block;margin:20px auto 80px;background:none;border:1px solid var(--marigold);color:var(--marigold);border-radius:999px;padding:10px 24px;cursor:pointer}

/* events view */
.events{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;padding:24px 0 80px}
.evcard{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit}
.evcard .stack{position:relative;aspect-ratio:4/3;margin-bottom:12px}
.evcard .stack img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:12px;border:3px solid var(--peacock-deep);transition:transform .45s cubic-bezier(.2,.9,.25,1.2)}
.evcard .stack img:nth-child(1){transform:rotate(-4deg) translate(-6px,4px)}
.evcard .stack img:nth-child(2){transform:rotate(3deg) translate(6px,2px)}
.evcard:hover .stack img:nth-child(1){transform:rotate(-9deg) translate(-22px,6px)}
.evcard:hover .stack img:nth-child(2){transform:rotate(8deg) translate(22px,2px)}
.evcard:hover .stack img:nth-child(3){transform:translateY(-6px)}
.evcard .t{font-weight:600;font-size:18px;line-height:1.25}
.evcard .m{color:var(--mist);font-size:14px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(4,22,25,.94);display:none;z-index:50;align-items:center;justify-content:center}
.lb.on{display:flex;animation:fade .25s ease}
@keyframes fade{from{opacity:0}}
.lb figure{margin:0;position:relative;max-width:92vw;max-height:84vh}
.lb{overflow:hidden}
.lb .imgwrap{position:relative;display:inline-block;transform-origin:0 0;touch-action:none;cursor:zoom-in;will-change:transform}
.lb .imgwrap.zoomed{cursor:grab}
.lb .imgwrap.dragging{cursor:grabbing}
.lb .imgwrap.easing{transition:transform .25s ease}
.zbar{display:flex;gap:8px;justify-content:center;position:fixed;z-index:5;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%)}
.lb .x,.lb .nav{z-index:5}
.lb figcaption,.lb .people-in{position:relative;z-index:4}
.zbar button{background:rgba(13,58,64,.85);border:1px solid var(--peacock-line);color:var(--silk);border-radius:999px;min-width:40px;height:36px;padding:0 12px;cursor:pointer;font-size:17px}
.zbar button:hover{border-color:var(--marigold)}
.zbar .zl{font-size:14px;color:var(--mist);min-width:56px;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.lb img{display:block;max-width:92vw;max-height:80vh;border-radius:6px;animation:pop .35s cubic-bezier(.2,.9,.25,1.15)}
@keyframes pop{from{transform:scale(.94);opacity:.3}}
.lb .ring{position:absolute;border:3px solid var(--marigold);border-radius:50%;pointer-events:none;animation:ringin .6s .15s both cubic-bezier(.2,.9,.25,1.3)}
@keyframes ringin{from{transform:scale(1.8);opacity:0}}
.lb figcaption{color:var(--mist);text-align:center;margin-top:12px;font-size:15px}
.lb figcaption b{color:var(--silk);font-weight:600}
.lb .nav{position:fixed;top:50%;transform:translateY(-50%);background:rgba(13,58,64,.8);border:1px solid var(--peacock-line);width:52px;height:52px;border-radius:50%;cursor:pointer;font-size:24px}
.lb .prev{left:18px}.lb .next{right:18px}
.lb .x{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));right:calc(18px + env(safe-area-inset-right,0px));background:none;border:1px solid var(--peacock-line);border-radius:999px;padding:6px 16px;cursor:pointer}
.lb .people-in{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.lb .people-in button{background:none;border:0;padding:0;cursor:pointer}
.lb .people-in img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--peacock-line);animation:none;max-width:none}
.lb .people-in button:hover img{border-color:var(--marigold)}

footer{color:#6f9a9a;font-size:14px;padding:30px 0 50px;border-top:1px solid var(--peacock-line)}
.empty{color:var(--mist);padding:40px 0}
@media (max-width:600px){
  .wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .people{grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:24px 12px}
  .person .ph,.person.big .ph{width:90px;height:90px}
  .grid{columns:2 140px}
  .lb .nav{width:42px;height:42px;top:auto;bottom:18px;transform:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before{animation:none!important;transition:none!important}
  .person{opacity:1;transform:none}
}
</style>
</head>
<body>



<div class="wrap">
  <header class="top">
    <h1>Family Photos<span class="mark" aria-hidden="true"></span></h1>
    <p class="lede" id="lede"></p>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="people" aria-selected="true">People</button>
      <button role="tab" data-tab="events" aria-selected="false">Events</button>
      <button role="tab" data-tab="all" aria-selected="false">All photos</button>
      <button role="tab" data-tab="videos" aria-selected="false">Videos</button>
    </nav>
  </header>
  <main id="main"></main>
  <footer>Photos and videos here are smaller copies; the full-size originals are in the Family Photos folder on Google Drive. Click a name under any face to type a new one. <button class="ren" id="ownerlink">Sign in</button></footer>
</div>

<button id="totop" aria-label="Back to top">↑</button>
<div class="vb" id="vb" role="dialog" aria-modal="true" aria-label="Video player">
  <button class="x" id="vbx">Close</button>
  <video id="vbv" controls playsinline preload="metadata"></video>
  <div class="cap" id="vbc"></div>
</div>
<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" id="lbx">Close</button>
  <button class="nav prev" id="lbp" aria-label="Previous photo">‹</button>
  <figure>
    <div class="imgwrap" id="lbw"><img id="lbi" alt=""></div>
    <figcaption id="lbc"></figcaption>
    <div class="zbar" aria-label="Zoom"><button id="zo" aria-label="Zoom out">−</button><span class="zl" id="zl">100%</span><button id="zi" aria-label="Zoom in">+</button><button id="zr">Fit</button><span class="sep"></span><button class="zt" id="zid" aria-pressed="false" title="Show who is in this photo"><svg viewBox="0 0 24 24"><circle cx="12" cy="10" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/><path d="M2 7V3h4M22 7V3h-4"/></svg><span class="lbl">Identify faces</span></button><button class="zt" id="zss" aria-pressed="false" title="Play a slideshow"><svg viewBox="0 0 24 24"><path d="M7 5l12 7-12 7z"/></svg><span class="lbl">Slideshow</span></button><a class="zbtn" id="zdl" download title="Download this photo"><svg viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg><span class="lbl">Download</span></a></div>
    <div class="people-in" id="lbpe"></div>
  </figure>
  <button class="nav next" id="lbn" aria-label="Next photo">›</button>
</div>

<script>
let D, P, PEOPLE;
const $ = s => document.querySelector(s);
const main = $('#main');
const store = {
  get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v);}catch(e){return d;} },
  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }
};
/* ---------- names, hidden people and visits: stored in Firebase (Google sign-in) ---------- */
const OWNER_EMAIL = 'bcharan197@gmail.com';
const FB_CONFIG = {apiKey: 'AIzaSyBKWw4QfIw5KWxgZKpqZrqjg-hYmB9hTwM', authDomain: 'family-photos-d22ad.firebaseapp.com', projectId: 'family-photos-d22ad', storageBucket: 'family-photos-d22ad.firebasestorage.app', messagingSenderId: '173802453091', appId: '1:173802453091:web:2f16e297e8f6f494f42056'};
const FBV = 'https://www.gstatic.com/firebasejs/10.12.2/';
let names = {};                                 // names everyone sees (Firebase: settings/names)
let localNames = store.get('fp-names', {});    // names a visitor typed, kept in their own browser
let IS_OWNER = false, ME = null, hiddenFailed = false, FB = null;
let hiddenIds = new Set(), HP = new Set(), ORIG = null;
const vis = i => !HP.has(i);
const shownPeople = () => PEOPLE.filter(p => !p.hidden && p.photos.length);
function applyHidden(){
  if(!ORIG) ORIG = PEOPLE.map(p => p.photos.slice());
  HP = new Set(); hiddenIds.forEach(id => (ORIG[id] || []).forEach(i => HP.add(i)));
  PEOPLE.forEach(p => { p.hidden = hiddenIds.has(p.id); p.photos = ORIG[p.id].filter(vis); });
  for(const k in peopleIn) delete peopleIn[k];
  PEOPLE.forEach(p => { if(!p.hidden) p.photos.forEach(i => (peopleIn[i] ||= []).push(p.id)); });
  EVENTS = eventList().map(g => g[0]);
  const np = shownPeople().length, nph = P.filter((_, i) => vis(i)).length;
  $('#lede').textContent = `${np} people found in ${nph.toLocaleString()} recovered photos. Pick a face to see every photo that person is in.`;
}
const getJSON = f => fetch(f + '?v=' + Date.now(), {cache: 'no-store'}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); });
const cleanNames = v => { const o = {}; if(v && typeof v === 'object') for(const k in v) if(/^\d+$/.test(k) && typeof v[k] === 'string' && v[k].trim()) o[k] = v[k].trim().slice(0, 60); return o; };
const cleanIds = v => Array.isArray(v) ? v.filter(Number.isInteger) : [];
let legacy = {names: {}, ids: []};             // what the earlier GitHub version saved, moved over on first sign-in
const capsReady = (async () => {
  const [appM, authM, fsM] = await Promise.all([import(FBV + 'firebase-app.js'), import(FBV + 'firebase-auth.js'), import(FBV + 'firebase-firestore.js')]);
  const app = appM.initializeApp(FB_CONFIG);
  FB = {auth: authM.getAuth(app), db: fsM.getFirestore(app), A: authM, F: fsM};
  getJSON('names.json').then(v => { legacy.names = cleanNames(v); }).catch(() => {});
  getJSON('hidden.json').then(v => { legacy.ids = cleanIds(v?.ids); }).catch(() => {});
  const first = (ref, apply) => new Promise(res => {
    let done = false;
    const t = setTimeout(() => { if(!done){ done = true; res(false); } }, 10000);
    fsM.onSnapshot(ref, s => {
      apply(s.exists() ? s.data() : null);
      if(!done){ done = true; clearTimeout(t); res(true); }
      else if(P){ if(apply === applyHiddenDoc) applyHidden(); if(!/^(nm|nmi-)/.test(document.activeElement?.id || '')) { route(); } }
    }, () => { if(!done){ done = true; clearTimeout(t); res(false); } });
  });
  const okH = await first(fsM.doc(FB.db, 'settings', 'hidden'), applyHiddenDoc);
  if(!okH) hiddenFailed = true;
  await first(fsM.doc(FB.db, 'settings', 'names'), v => { names = cleanNames(v?.names); });

  setTab('videos');
  if(!VIDEOS.length){ main.innerHTML = '<p class="empty">The videos didn’t load. Reload the page to try again.</p>'; return; }
  main.innerHTML = `<div class="evmeta" style="color:var(--mist);margin:22px 0 4px">${VIDEOS.length} videos. These are smaller copies for watching here; the originals are in the Family Photos folder on Google Drive.</div>` +
    videoGroups().map(([ev, ks]) => `<section class="ev"><h3>${esc(ev)}</h3><div class="evmeta">${ks.length} video${ks.length>1?'s':''}${VIDEOS[ks[0]].ed?' · '+niceMonth(VIDEOS[ks[0]].ed):''}</div><div class="vgrid">${ks.map(vcard).join('')}</div></section>`).join('') + '<div style="height:60px"></div>';
  wireV(main); window.scrollTo(0,0);
}
const vb = $('#vb'), vbv = $('#vbv');
function openVideo(k){
  const v = VIDEOS[k]; vbv.src = v.s; vbv.poster = v.p;
  $('#vbc').innerHTML = `<b>${esc(v.e)}</b>${v.d?' · '+niceDate(v.d):''} · ${fmtDur(v.dur)}`;
  vb.classList.add('on'); document.body.style.overflow = 'hidden'; $('#vbx').focus();
  vbv.play().catch(() => {});
}
function closeVideo(){ vbv.pause(); vbv.removeAttribute('src'); vbv.load(); vb.classList.remove('on'); document.body.style.overflow = ''; }
$('#vbx').onclick = closeVideo;
vb.onclick = e => { if(e.target === vb) closeVideo(); };
document.addEventListener('keydown', e => { if(e.key === 'Escape' && vb.classList.contains('on')) closeVideo(); });

/* ---------- lightbox ---------- */
let LB = {seq:[], k:0, pid:null};
const lb = $('#lb');
function openLB(seq, k, pid){ LB = {seq, k, pid}; IDENT = false; lb.classList.add('on'); showLB(); $('#lbx').focus(); document.body.style.overflow='hidden'; }
function closeLB(){ lb.classList.remove('on'); document.body.style.overflow=''; resetZoom(false); setSlideshow(false); }
/* zoom: wheel, pinch, double-click, + and − buttons; drag to move around when zoomed */
const lbw = $('#lbw'); let Z = {s:1, x:0, y:0};
const ZMIN = 1, ZMAX = 6;
function applyZoom(ease){
  lbw.classList.toggle('easing', !!ease);
  lbw.style.transform = Z.s === 1 && !Z.x && !Z.y ? '' : `translate(${Z.x}px,${Z.y}px) scale(${Z.s})`;
  lbw.classList.toggle('zoomed', Z.s > 1);
  $('#zl').textContent = Math.round(Z.s * 100) + '%';
}
function resetZoom(ease){ Z = {s:1, x:0, y:0}; applyZoom(ease); }
function zoomAt(ns, cx, cy, ease){
  ns = Math.min(ZMAX, Math.max(ZMIN, ns));
  const r = lbw.getBoundingClientRect(), bx = r.left - Z.x, by = r.top - Z.y;
  const px = (cx - bx - Z.x) / Z.s, py = (cy - by - Z.y) / Z.s;
  if(ns === 1){ resetZoom(ease); return; }
  Z = {s: ns, x: cx - bx - px * ns, y: cy - by - py * ns}; applyZoom(ease);
}
const centre = () => { const r = lbw.getBoundingClientRect(); return [r.left + r.width/2, r.top + r.height/2]; };
$('#zi').onclick = e => { e.stopPropagation(); const [x,y] = centre(); zoomAt(Z.s * 1.6, x, y, true); };
$('#zo').onclick = e => { e.stopPropagation(); const [x,y] = centre(); zoomAt(Z.s / 1.6, x, y, true); };
$('#zr').onclick = e => { e.stopPropagation(); resetZoom(true); };
lbw.addEventListener('wheel', e => { e.preventDefault(); zoomAt(Z.s * Math.exp(-e.deltaY * 0.0022), e.clientX, e.clientY, false); }, {passive:false});
lbw.addEventListener('dblclick', e => { Z.s > 1 ? resetZoom(true) : zoomAt(2.5, e.clientX, e.clientY, true); });
const ptrs = new Map(); let pinch = null, drag = null;
lbw.addEventListener('pointerdown', e => {
  lbw.setPointerCapture(e.pointerId); ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if(ptrs.size === 2){ const [a, b] = [...ptrs.values()]; pinch = {d: Math.hypot(a[0]-b[0], a[1]-b[1]), s: Z.s}; drag = null; }
  else if(Z.s > 1){ drag = {x: e.clientX - Z.x, y: e.clientY - Z.y}; lbw.classList.add('dragging'); }
});
lbw.addEventListener('pointermove', e => {
  if(!ptrs.has(e.pointerId)) return; ptrs.set(e.pointerId, [e.clientX, e.clientY]);
  if(pinch && ptrs.size === 2){ const [a, b] = [...ptrs.values()]; zoomAt(pinch.s * Math.hypot(a[0]-b[0], a[1]-b[1]) / pinch.d, (a[0]+b[0])/2, (a[1]+b[1])/2, false); }
  else if(drag){ Z.x = e.clientX - drag.x; Z.y = e.clientY - drag.y; applyZoom(false); }
});
const endPtr = e => { ptrs.delete(e.pointerId); if(ptrs.size < 2) pinch = null; if(!ptrs.size){ drag = null; lbw.classList.remove('dragging'); } };
lbw.addEventListener('pointerup', endPtr); lbw.addEventListener('pointercancel', endPtr);
function showLB(){
  const i = LB.seq[LB.k], ph = P[i];
  const img = $('#lbi');
  img.style.animation='none'; img.offsetHeight; img.style.animation='';
  resetZoom(false);
  img.src = BLANK; photoURL(i).then(u => { if(LB.seq[LB.k] === i && !img.dataset.hd) img.src = u; }).catch(() => {});
  delete img.dataset.hd;
  const hd = new Image(); hd.onload = () => { if(LB.seq[LB.k] === i){ img.src = hd.src; img.dataset.hd = '1'; } }; hd.src = `hd/${i}.jpg`;
  drawRings(i);
  const dl = $('#zdl'); dl.href = `hd/${i}.jpg`; dl.setAttribute('download', `${(ph.e || 'photo').replace(/[^\w -]+/g, '')} ${ph.d ? ph.d.slice(0,10) : i}.jpg`);
  $('#lbc').innerHTML = `<b>${esc(ph.e)}</b>${ph.d?' · '+niceDate(ph.d):''} · ${LB.k+1} of ${LB.seq.length}`;
  const who = peopleIn[i] || [];
  $('#lbpe').innerHTML = who.map(id => `<button data-id="${id}" title="${esc(nameOf(PEOPLE[id]))}"><img src="${BLANK}" data-fi="${id}" alt="${esc(nameOf(PEOPLE[id]))}"></button>`).join('');
  $('#lbpe').querySelectorAll('button').forEach(b => b.onclick = () => { closeLB(); go('#person-'+b.dataset.id); });
}
let IDENT = false, SHOW = null;
function drawRings(i){
  const w = $('#lbw'); w.querySelectorAll('.ring,.rtag').forEach(r => r.remove());
  $('#zid').classList.toggle('on', IDENT); $('#zid').setAttribute('aria-pressed', IDENT);
  if(!IDENT) return;
  const ids = [...new Set([...(peopleIn[i] || []), ...(LB.pid != null && !PEOPLE[LB.pid].hidden ? [LB.pid] : [])])];
  ids.forEach(id => {
    const box = PEOPLE[id].box[i]; if(!box) return;
    const other = LB.pid != null && id !== LB.pid ? ' other' : '';
    const r = document.createElement('span'); r.className = 'ring' + other; const pad = .25;
    Object.assign(r.style, {left:`${(box[0]-box[2]*pad/2)*100}%`, top:`${(box[1]-box[3]*pad/2)*100}%`, width:`${box[2]*(1+pad)*100}%`, height:`${box[3]*(1+pad)*100}%`});
    const t = document.createElement('span'); t.className = 'rtag' + other; t.textContent = nameOf(PEOPLE[id]);
    Object.assign(t.style, {left:`${(box[0]+box[2]/2)*100}%`, top:`${(box[1]+box[3]*(1+pad/2))*100}%`});
    w.appendChild(r); w.appendChild(t);
  });
  if(!ids.length){ const t = document.createElement('span'); t.className = 'rtag other'; t.textContent = 'No faces found in this photo'; Object.assign(t.style, {left:'50%', top:'2%'}); w.appendChild(t); }
}
function setSlideshow(on){
  clearInterval(SHOW); SHOW = on ? setInterval(() => step(1), 3500) : null;
  $('#zss').classList.toggle('on', on); $('#zss').setAttribute('aria-pressed', on);
  $('#zss .lbl').textContent = on ? 'Pause' : 'Slideshow';
}
$('#zid').onclick = e => { e.stopPropagation(); IDENT = !IDENT; drawRings(LB.seq[LB.k]); };
$('#zss').onclick = e => { e.stopPropagation(); setSlideshow(!SHOW); };
$('#zdl').onclick = e => e.stopPropagation();
const step = d => { LB.k = (LB.k + d + LB.seq.length) % LB.seq.length; showLB(); };
$('#lbp').onclick = () => step(-1); $('#lbn').onclick = () => step(1); $('#lbx').onclick = closeLB;
lb.onclick = e => { if(e.target===lb) closeLB(); };
document.addEventListener('keydown', e => {
  if(!lb.classList.contains('on')) return;
  if(e.key==='Escape') closeLB(); else if(e.key==='ArrowLeft') step(-1); else if(e.key==='ArrowRight') step(1);
  else if(e.key==='+' || e.key==='='){ const [x,y] = centre(); zoomAt(Z.s * 1.6, x, y, true); }
  else if(e.key==='-'){ const [x,y] = centre(); zoomAt(Z.s / 1.6, x, y, true); }
  else if(e.key==='0') resetZoom(true);
  else if(e.key==='i' || e.key==='I') $('#zid').click();
  else if(e.key===' '){ e.preventDefault(); $('#zss').click(); }
});
let tx=null; lb.addEventListener('touchstart', e => { tx = (e.touches.length === 1 && Z.s === 1) ? e.touches[0].clientX : null; }, {passive:true});
lb.addEventListener('touchend', e => { if(tx==null || Z.s !== 1) { tx = null; return; } const dx = e.changedTouches[0].clientX - tx; if(Math.abs(dx)>50) step(dx<0?1:-1); tx=null; });

let EVENTS = [];
addEventListener('scroll', () => $('#totop').classList.toggle('show', scrollY > 900), {passive:true});
$('#totop').onclick = () => scrollTo({top:0, behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth'});
$('#ownerlink').onclick = () => go('#owner');
fetch('data.json').then(r => { if(!r.ok) throw new Error(r.status); return r.json(); }).then(data => {
  D = data; P = D.photos; PEOPLE = D.people;
  main.innerHTML = '<p class="empty">Loading the family photos…</p>';
  return capsReady.catch(() => {}).then(() => {
    if(hiddenFailed || !FB){ main.innerHTML = '<p class="empty">The list of hidden people didn’t load, so the photos are held back. Reload the page to try again.</p>'; return; }
    applyHidden();
    if(IS_OWNER){ addPrivateTab(); adoptLocalNames(); }
    route();
  });
}).catch(() => { main.innerHTML = '<p class="empty">The photo list did not load. Reload the page to try again.</p>'; });
</script>
